<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Reclaim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <header>
    <nav>
      <button class="hamburger-btn" aria-label="Open navigation menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <h1 class="logo">Reclaim</h1>
      <ul class="nav-links"></ul>
    </nav>
  </header>
  <main>
    <!-- Hero Section -->
    <section class="games-hero">
      <div class="hero-content">
        <h2>🎮 Reclaim Games</h2>
        <p>Take a mental break and compete on the leaderboards!</p>
      </div>
    </section>

    <!-- Login prompt (shown only for logged-out users) -->
    <div id="loginPrompt" class="login-prompt" style="display: none;">
      <h3>🔒 Login Required</h3>
      <p>You need to be logged in to play games and save your scores!</p>
      <a href="login.html" class="btn btn-primary">Login</a>
      <a href="signup.html" class="btn btn-secondary">Sign Up</a>
    </div>

    <!-- Games Grid -->
    <div class="games-grid" id="gamesGrid">
      <!-- Game cards will be populated by games.js -->
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Reclaim - Helping students reclaim their wellness</p>
  </footer>

  <script src="userDataManager.js"></script>
  <script src="nav.js"></script>
  <script src="games.js"></script>
  <script src="accessibility.js"></script>
</body>
</html>
