<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire - Reclaim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <header>
    <nav>
        <button class="hamburger-btn" aria-label="Open navigation menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <h1 class="logo">Reclaim</h1>
        <ul class="nav-links"></ul>
    </nav>
    </header>
    <main>
        <div class="game-container">
            <div class="game-header">
                <div class="game-stats">
                    <div class="stat">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Moves</span>
                        <span class="stat-value" id="moves">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Time</span>
                        <span class="stat-value" id="timer">00:00</span>
                    </div>
                </div>
                <div class="game-controls">
                    <button class="btn btn-small btn-secondary" id="undoBtn">Undo</button>
                    <button class="btn btn-small btn-secondary" id="hintBtn">Hint</button>
                    <button class="btn btn-small btn-primary" id="newGameBtn">New Game</button>
                    <a href="wellness-tools.html" class="btn btn-small">Back to Games</a>
                </div>
            </div>

            <div class="game-board">
                <div class="board-top">
                    <div class="stock-waste">
                        <div class="card-pile" id="stock" data-label="Stock"></div>
                        <div class="card-pile" id="waste" data-label="Waste"></div>
                    </div>
                    <div class="foundations">
                        <div class="card-pile foundation" id="foundation-0" data-suit="hearts" data-label="♥"></div>
                        <div class="card-pile foundation" id="foundation-1" data-suit="diamonds" data-label="♦"></div>
                        <div class="card-pile foundation" id="foundation-2" data-suit="clubs" data-label="♣"></div>
                        <div class="card-pile foundation" id="foundation-3" data-suit="spades" data-label="♠"></div>
                    </div>
                </div>

                <div class="tableau">
                    <div class="tableau-column" id="tableau-0" data-column="0"></div>
                    <div class="tableau-column" id="tableau-1" data-column="1"></div>
                    <div class="tableau-column" id="tableau-2" data-column="2"></div>
                    <div class="tableau-column" id="tableau-3" data-column="3"></div>
                    <div class="tableau-column" id="tableau-4" data-column="4"></div>
                    <div class="tableau-column" id="tableau-5" data-column="5"></div>
                    <div class="tableau-column" id="tableau-6" data-column="6"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Win Modal -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="trophy">🏆</div>
                <h2>Congratulations!</h2>
                <p>You won the game!</p>
            </div>

            <div class="final-stats">
                <div class="final-stat">
                    <div class="final-stat-value" id="finalScore">0</div>
                    <div class="final-stat-label">Final Score</div>
                </div>
                <div class="final-stat">
                    <div class="final-stat-value" id="finalMoves">0</div>
                    <div class="final-stat-label">Total Moves</div>
                </div>
                <div class="final-stat">
                    <div class="final-stat-value" id="finalTime">00:00</div>
                    <div class="final-stat-label">Time Taken</div>
                </div>
            </div>

            <div id="personalBestContainer"></div>

            <div class="leaderboard">
                <h3>Top Scores</h3>
                <ul class="leaderboard-list" id="leaderboardList">
                    <li class="leaderboard-item">
                        <span>Loading...</span>
                    </li>
                </ul>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" id="playAgainBtn" style="flex: 1;">Play Again</button>
                <button class="btn btn-secondary" id="closeModalBtn" style="flex: 1;">Close</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Reclaim - Helping students reclaim their wellness</p>
    </footer>

    <!-- Scripts -->
    <script src="userDataManager.js"></script>
    <script src="nav.js"></script>
    <script src="game-solitaire.js"></script>
</body>
</html>
